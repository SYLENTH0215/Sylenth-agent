name: SYLENTH Agent 24/7
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */4 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v3

      - name: Python-ni sozlash
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # FFmpeg-ni eng ishonchli va tezkor usulda o'rnatish
      - name: FFmpeg o'rnatish
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Kutubxonalarni yuklash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botni ishga tushirish
        env:
          BOT_TOKEN:        ${{ secrets.BOT_TOKEN }}
          GEMINI_KEY:       ${{ secrets.GEMINI_KEY }}
          ADMIN_ID:         ${{ secrets.ADMIN_ID }}
          REQUIRED_CHANNEL: ${{ secrets.REQUIRED_CHANNEL }}
        # 14000 soniya (~3.8 soat) davomida ishlaydi, keyin xatosiz yopiladi
        run: timeout 14000 python main.py || true
