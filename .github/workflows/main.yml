name: SYLENTH Agent 24/7

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python-ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg o'rnatish
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Kutubxonalarni yuklash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botni ishga tushirish
        run: timeout --preserve-status 20000s python main.py
