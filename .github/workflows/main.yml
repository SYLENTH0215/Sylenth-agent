name: SYLENTH Agent 24/7

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */4 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v3

      - name: Python-ni sozlash
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Muammoli action olib tashlandi, uning o'rniga barqaror apt-get usuli qo'yildi
      - name: FFmpeg o'rnatish (Ishonchli usul)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Kutubxonalarni yuklash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botni ishga tushirish
        env:
          BOT_TOKEN:        ${{ secrets.BOT_TOKEN }}
          GEMINI_KEY:       ${{ secrets.GEMINI_KEY }}
          ADMIN_ID:         ${{ secrets.ADMIN_ID }}
          REQUIRED_CHANNEL: ${{ secrets.REQUIRED_CHANNEL }}
        run: timeout --preserve-status 14000s python main.py
